# Spielt neue Datenbank-Änderungen (supabase/migrations) nach dem Merge auf main
# automatisch in das Supabase-Projekt juki-test ein, zusammen mit den erfundenen Testdaten (supabase/seed.sql).
# Bei jedem Pull Request laufen vorher die automatischen Tests der Rechte-Regeln (supabase/tests/).
#
# Einmalig nötig (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN      – Zugangsschlüssel aus Supabase, nur für juki-test
#   SUPABASE_DB_PASSWORD_TEST  – Datenbank-Passwort von juki-test
name: Datenbank

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - '.github/workflows/datenbank.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/datenbank.yml'
  workflow_dispatch: # Start per Knopfdruck unter „Actions“

permissions:
  contents: read

# Nie zwei Einspielungen gleichzeitig
concurrency:
  group: datenbank-test
  cancel-in-progress: false

jobs:
  # Bei jedem Pull Request: alle Änderungen in eine frische, leere Probe-Datenbank
  # einspielen. Fehler fallen so VOR dem Merge auf. Braucht keine geheimen Werte.
  probelauf:
    name: Probelauf mit leerer Datenbank
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Probe-Datenbank starten und alle Änderungen einspielen
        run: |
          supabase db start
          supabase db push --yes
      - name: Rechte-Regeln testen (leere Datenbank)
        run: psql "$DB" -f supabase/tests/rechte.sql
      - name: Testdaten einspielen (zweimal, damit sicher ist, dass Wiederholen nichts kaputt macht)
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
      - name: Rechte-Regeln testen (mit Testdaten)
        run: psql "$DB" -f supabase/tests/rechte.sql
      - name: Kontrolle
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "select public.datenbank_stand();"

  einspielen:
    name: In juki-test einspielen
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_TEST }}
      PROJEKT: etftjzthbpuobyfceuuv # juki-test (nicht geheim, steht auch in .env)
    steps:
      - uses: actions/checkout@v4

      - name: Geheime Werte vorhanden?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN oder SUPABASE_DB_PASSWORD_TEST fehlt in den GitHub-Secrets."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Mit juki-test verbinden
        run: supabase link --project-ref "$PROJEKT" --password "$SUPABASE_DB_PASSWORD"

      # --include-seed: Testdaten nur hier, im Test-Projekt. Für juki-live später NIE verwenden!
      - name: Diese Änderungen werden eingespielt
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --include-seed --dry-run

      - name: Einspielen
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --include-seed --yes
