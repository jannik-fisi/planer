# Prüft bei jedem Pull Request und auf main, ob die App fehlerfrei baut.
# Veröffentlicht wird nicht hier, sondern in „Veröffentlichen“ nach dem Merge auf main.
name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung und Build
        run: npm run build
      - name: Kein geheimer Schlüssel im Code
        run: |
          if grep -rEn "sb_secret_[A-Za-z0-9_-]{10,}" src public .env; then
            echo "::error::Geheimer Schlüssel gefunden! Bitte entfernen und in Supabase neu erzeugen."
            exit 1
          fi
